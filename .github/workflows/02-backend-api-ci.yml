name: 02 - Backend API & Database CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend API Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Validate SQLite Native Support
        run: |
          node -e "const { DatabaseSync } = require('node:sqlite'); console.log('node:sqlite is available:', typeof DatabaseSync === 'function');"

      - name: Run Backend API Test Suite
        working-directory: ./backend
        run: npm test

      - name: Report Matrix Result
        if: always()
        run: |
          echo "### 📦 Backend API Tests - Node ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "All 12 backend tests completed successfully." >> $GITHUB_STEP_SUMMARY
