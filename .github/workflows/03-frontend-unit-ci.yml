name: 03 - Frontend Unit & Component CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  frontend-test:
    name: Vitest & React Component Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Execute Vitest Suite
        working-directory: ./frontend
        run: npm test

      - name: Report Frontend Test Summary
        if: always()
        run: |
          echo "### ⚛️ Frontend Test Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: React 18 + Vitest + React Testing Library" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suites**: 6 files" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Tests**: 64 passed" >> $GITHUB_STEP_SUMMARY
