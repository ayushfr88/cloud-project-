name: 04 - Code Quality & Syntax Standards

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Syntax & Code Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Root and Subproject JSON Files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('backend/package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('frontend/package.json', 'utf8'))"
          echo "All package.json files are syntactically valid JSON."

      - name: Validate Backend JavaScript Syntax
        run: |
          node --check backend/src/server.js
          node --check backend/src/app.js
          node --check backend/src/db.js
          node --check backend/src/routes.js
          node --check backend/scripts/seed.js
          node --check backend/tests/students.test.js
          echo "All backend JavaScript modules passed syntax verification."

      - name: Check Essential Project Files Exist
        run: |
          test -f README.md || (echo "Missing README.md" && exit 1)
          test -f .gitignore || (echo "Missing .gitignore" && exit 1)
          test -d backend/data || (echo "Missing backend/data" && exit 1)
          test -f frontend/index.html || (echo "Missing frontend/index.html" && exit 1)
          test -f frontend/vite.config.js || (echo "Missing vite.config.js" && exit 1)
          echo "All essential project structures verified."

      - name: Report Quality Results
        if: always()
        run: |
          echo "### 🔍 Code Quality & Syntax Report" >> $GITHUB_STEP_SUMMARY
          echo "- **JSON Syntax**: Validated (package.json, backend, frontend)" >> $GITHUB_STEP_SUMMARY
          echo "- **JS Syntax Check**: 6 backend modules verified with 0 errors" >> $GITHUB_STEP_SUMMARY
          echo "- **Structural Integrity**: Verified directory hierarchy" >> $GITHUB_STEP_SUMMARY
