name: 08 - Database Integrity & API Smoke Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  db-integrity:
    name: SQLite Schema & API Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Test Database Schema Initialization
        run: |
          node -e "
          const { initDatabase } = require('./backend/src/db');
          const db = initDatabase(':memory:');

          // Verify table exists
          const tbl = db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name='students'\").get();
          if (!tbl) { console.error('FAIL: students table missing'); process.exit(1); }

          // Verify all columns are present
          const cols = db.prepare('PRAGMA table_info(students)').all().map(c => c.name);
          const expected = ['id','name','email','course','semester','created_at'];
          expected.forEach(c => {
            if (!cols.includes(c)) { console.error('FAIL: missing column', c); process.exit(1); }
          });

          // Test CRUD operations
          db.prepare('INSERT INTO students (name, email, course, semester) VALUES (?,?,?,?)').run('Test Student','test@example.edu','CS',1);
          const student = db.prepare('SELECT * FROM students WHERE email=?').get('test@example.edu');
          if (!student || student.name !== 'Test Student') { console.error('FAIL: insert/read'); process.exit(1); }

          // Test unique email constraint
          try {
            db.prepare('INSERT INTO students (name, email, course, semester) VALUES (?,?,?,?)').run('Dup','test@example.edu','IT',2);
            console.error('FAIL: duplicate email should be rejected');
            process.exit(1);
          } catch (e) { /* expected */ }

          // Test update and delete
          db.prepare('UPDATE students SET semester=? WHERE email=?').run(5, 'test@example.edu');
          db.prepare('DELETE FROM students WHERE email=?').run('test@example.edu');
          const gone = db.prepare('SELECT * FROM students WHERE email=?').get('test@example.edu');
          if (gone) { console.error('FAIL: delete did not work'); process.exit(1); }

          console.log('All database integrity checks passed!');
          "

      - name: Seed In-Memory Database and Validate Record Count
        run: |
          node -e "
          process.env.DB_PATH = ':memory:';
          const { initDatabase } = require('./backend/src/db');
          const db = initDatabase(':memory:');

          const insert = db.prepare('INSERT INTO students (name, email, course, semester) VALUES (?,?,?,?)');
          const students = [
            ['Alice','alice@edu.com','CS',1],
            ['Bob','bob@edu.com','IT',2],
            ['Carol','carol@edu.com','Data Science',3],
          ];
          students.forEach(s => insert.run(...s));

          const count = db.prepare('SELECT COUNT(*) as cnt FROM students').get().cnt;
          if (count !== 3) { console.error('FAIL: expected 3 students, got', count); process.exit(1); }

          // Search filter test
          const results = db.prepare('SELECT * FROM students WHERE name LIKE ?').all('%ali%');
          if (results.length !== 1) { console.error('FAIL: search filter broken'); process.exit(1); }

          console.log('Seed + filter validation passed! Records:', count);
          "

      - name: Report DB Integrity Results
        if: always()
        run: |
          echo "### 🗄️ Database Integrity Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Engine**: node:sqlite (built-in, no native compilation)" >> $GITHUB_STEP_SUMMARY
          echo "- **Schema Validation**: students table + 6 columns ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **CRUD Operations**: Insert, Read, Update, Delete ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Unique Constraint**: Duplicate email rejection ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Search Filtering**: LIKE query validation ✅" >> $GITHUB_STEP_SUMMARY
